[project]
name = "babelio-automation"
version = "0.2.0"
description = "Automate book synchronization from Google Sheets to Babelio using Playwright and gog CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.3.1",
    "playwright>=1.58.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
babelio-cli = "main:cli"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "babelio_api", "babelio_parsers", "gog_client", "config"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.5.1",
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.6",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "S",   # flake8-bandit (security checks)
]
ignore = [
    "S603", # subprocess call un-trusted input
    "S404", # import subprocess
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "__pycache__"]
skips = ["B101", "B404", "B603"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]
branch = true

[tool.coverage.report]
show_missing = true
# Browser-driven code (Playwright flows, CLI wiring) is verified manually against
# the live site; the threshold guards the parsing/filtering/config logic.
fail_under = 45

[tool.mypy]
python_version = "3.12"
files = ["main.py", "babelio_api.py", "babelio_parsers.py", "gog_client.py", "config.py"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
