version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      # One PR per week for all non-major updates (minor, patch).
      uv-minor-patch:
        update-types:
          - minor
          - patch
      # Major bumps are risky: keep them grouped but separate for review.
      uv-major:
        update-types:
          - major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"
